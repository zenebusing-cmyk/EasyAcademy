<!DOCTYPE html>
<html>

<head>

    <title>Add Fee Payment</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .student-name {
            text-align: center;
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #333;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Add Fee Payment</h1>

    <div class="student-name">
        Student: <strong>{{ student.name }}</strong>
    </div>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Payment
        </button>

    </form>

</div>

</body>

</html>
